<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1915" viewBox="0 0 960 1915" role="img" aria-labelledby="visual-title visual-description">
<title id="visual-title">Proposed Changes to Willowbank Community Park</title>
<desc id="visual-description">Two maps use the same rectangular boundary, scale, and north-up orientation. Coordinates are measured east and north from the south-west corner. All listed areas have rectangular footprints, and unmarked land is grass. The entrance and the two intersecting paths are shared by both layouts. Full source data: {&quot;unit&quot;:&quot;metres&quot;,&quot;width&quot;:200,&quot;height&quot;:160,&quot;origin&quot;:&quot;south-west corner&quot;,&quot;north&quot;:&quot;up&quot;,&quot;background&quot;:&quot;grass&quot;,&quot;areashape&quot;:&quot;rectangle&quot;,&quot;coordinaterule&quot;:&quot;For areas, x and y locate the south-west corner; width extends east and height extends north. Path points use the same coordinate system. Paths are clipped at the park boundary.&quot;,&quot;entrances&quot;:[{&quot;label&quot;:&quot;Main entrance&quot;,&quot;point&quot;:[100,0]}],&quot;paths&quot;:[{&quot;label&quot;:&quot;North-south path&quot;,&quot;width&quot;:10,&quot;points&quot;:[[100,0],[100,160]]},{&quot;label&quot;:&quot;East-west path&quot;,&quot;width&quot;:10,&quot;points&quot;:[[0,80],[200,80]]}],&quot;layouts&quot;:[{&quot;year&quot;:2025,&quot;status&quot;:&quot;existing&quot;,&quot;areas&quot;:[{&quot;label&quot;:&quot;Playground&quot;,&quot;x&quot;:15,&quot;y&quot;:100,&quot;width&quot;:55,&quot;height&quot;:40},{&quot;label&quot;:&quot;Pond&quot;,&quot;x&quot;:130,&quot;y&quot;:100,&quot;width&quot;:50,&quot;height&quot;:35},{&quot;label&quot;:&quot;Tennis court&quot;,&quot;x&quot;:15,&quot;y&quot;:20,&quot;width&quot;:60,&quot;height&quot;:40},{&quot;label&quot;:&quot;Car park&quot;,&quot;x&quot;:125,&quot;y&quot;:15,&quot;width&quot;:60,&quot;height&quot;:40},{&quot;label&quot;:&quot;Cafe&quot;,&quot;x&quot;:145,&quot;y&quot;:60,&quot;width&quot;:25,&quot;height&quot;:10}]},{&quot;year&quot;:2030,&quot;status&quot;:&quot;proposed&quot;,&quot;areas&quot;:[{&quot;label&quot;:&quot;Playground&quot;,&quot;x&quot;:10,&quot;y&quot;:95,&quot;width&quot;:70,&quot;height&quot;:50},{&quot;label&quot;:&quot;Outdoor fitness area&quot;,&quot;x&quot;:130,&quot;y&quot;:100,&quot;width&quot;:50,&quot;height&quot;:35},{&quot;label&quot;:&quot;Community garden&quot;,&quot;x&quot;:15,&quot;y&quot;:20,&quot;width&quot;:60,&quot;height&quot;:40},{&quot;label&quot;:&quot;Car park&quot;,&quot;x&quot;:145,&quot;y&quot;:15,&quot;width&quot;:40,&quot;height&quot;:35},{&quot;label&quot;:&quot;Cafe&quot;,&quot;x&quot;:130,&quot;y&quot;:55,&quot;width&quot;:55,&quot;height&quot;:15},{&quot;label&quot;:&quot;Bicycle parking&quot;,&quot;x&quot;:115,&quot;y&quot;:20,&quot;width&quot;:20,&quot;height&quot;:25}]}]}</desc>
