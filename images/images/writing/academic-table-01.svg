<title id="visual-title">Four Commuter Ferry Routes</title>
<desc id="visual-description">A table has four route rows and three numerical columns. Passenger numbers are average total boardings in both directions on a weekday. Journey time and ticket price refer to one one-way journey. Each row's values follow the order of the columns array. Full source data: {&quot;period&quot;:&quot;2025&quot;,&quot;rowheading&quot;:&quot;Ferry route&quot;,&quot;columns&quot;:[{&quot;label&quot;:&quot;Average weekday passenger boardings&quot;,&quot;unit&quot;:&quot;boardings per weekday&quot;},{&quot;label&quot;:&quot;One-way journey time&quot;,&quot;unit&quot;:&quot;minutes&quot;},{&quot;label&quot;:&quot;Single-ticket price&quot;,&quot;unit&quot;:&quot;US dollars&quot;}],&quot;rows&quot;:[{&quot;label&quot;:&quot;Central Pier - Northbank&quot;,&quot;values&quot;:[2400,18,3.5]},{&quot;label&quot;:&quot;Central Pier - East Quay&quot;,&quot;values&quot;:[1850,25,4.2]},{&quot;label&quot;:&quot;Central Pier - Southport&quot;,&quot;values&quot;:[3100,32,5.1]},{&quot;label&quot;:&quot;Central Pier - West Island&quot;,&quot;values&quot;:[950,45,6.8]}]}</desc>
