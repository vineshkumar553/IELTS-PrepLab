<title id="visual-title">Composition of Household Waste in Two Districts</title>
<desc id="visual-description">Two equal-sized pie charts divide collected household waste into five categories by weight. Glass and metal form one combined category. Each waste item belongs to one category, and each pie totals 100 percent. Total collected weight is displayed beneath each pie. Full source data: {&quot;period&quot;:&quot;2025&quot;,&quot;unit&quot;:&quot;percent of collected waste by weight&quot;,&quot;totalunit&quot;:&quot;tonnes&quot;,&quot;legend&quot;:&quot;Waste category&quot;,&quot;categories&quot;:[&quot;Food&quot;,&quot;Paper and cardboard&quot;,&quot;Plastic&quot;,&quot;Glass and metal&quot;,&quot;Other waste&quot;],&quot;charts&quot;:[{&quot;label&quot;:&quot;Eastmere&quot;,&quot;total&quot;:14000,&quot;values&quot;:[40,25,20,10,5]},{&quot;label&quot;:&quot;Westmere&quot;,&quot;total&quot;:18000,&quot;values&quot;:[30,20,28,15,7]}]}</desc>
