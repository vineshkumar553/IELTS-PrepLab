<title id="visual-title">Business Websites and Online Sales</title>
<desc id="visual-description">Four business-size rows are compared across four percentage columns. Each percentage uses all businesses in the relevant size group and year as its denominator. Website ownership and online selling can overlap, so columns should not be added together. Values follow the order of the columns array. Full source data: {&quot;period&quot;:&quot;2015 and 2025&quot;,&quot;rowheading&quot;:&quot;Business size&quot;,&quot;columns&quot;:[{&quot;label&quot;:&quot;Had a website in 2015&quot;,&quot;unit&quot;:&quot;percent of businesses&quot;},{&quot;label&quot;:&quot;Had a website in 2025&quot;,&quot;unit&quot;:&quot;percent of businesses&quot;},{&quot;label&quot;:&quot;Sold online in 2015&quot;,&quot;unit&quot;:&quot;percent of businesses&quot;},{&quot;label&quot;:&quot;Sold online in 2025&quot;,&quot;unit&quot;:&quot;percent of businesses&quot;}],&quot;rows&quot;:[{&quot;label&quot;:&quot;Micro: 1-9 employees&quot;,&quot;values&quot;:[35,72,12,38]},{&quot;label&quot;:&quot;Small: 10-49 employees&quot;,&quot;values&quot;:[65,90,25,56]},{&quot;label&quot;:&quot;Medium: 50-249 employees&quot;,&quot;values&quot;:[82,97,40,74]},{&quot;label&quot;:&quot;Large: 250 or more employees&quot;,&quot;values&quot;:[95,99,60,88]}]}</desc>
